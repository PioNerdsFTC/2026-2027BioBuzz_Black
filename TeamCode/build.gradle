apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

def webProjectDir = rootProject.file('Web')
def webBuildDir = new File(webProjectDir, 'build')
def webAssetsDir = file('src/main/assets/web')

tasks.register('webInstall', Exec) {
    group = 'web'
    description = 'Installs SvelteKit dependencies (npm ci).'
    workingDir webProjectDir
    commandLine 'cp', "-r", webBuildDir, webAssetsDir
    doFirst {
        if (!webProjectDir.isDirectory()) {
            throw new GradleException("SvelteKit project not found at ${webProjectDir}")
        }
    }
}

tasks.register('buildWeb', Exec) {
    group = 'web'
    description = 'Builds the SvelteKit dashboard (npm run build).'
    dependsOn 'webInstall'
    workingDir webProjectDir
    commandLine 'bun', 'run', 'build'
}

tasks.register('syncWebAssets', Sync) {
    group = 'web'
    description = 'Copies the built SvelteKit dashboard into Android assets.'
    onlyIf { webBuildDir.isDirectory() }
    from webBuildDir
    into webAssetsDir
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
    if (gradle.startParameter.projectProperties.containsKey('buildWeb')) {
        dependsOn 'buildWeb'
    }
}

tasks.named('syncWebAssets') {
    mustRunAfter 'buildWeb'
}
